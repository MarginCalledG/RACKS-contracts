[profile.default]
# F-01: without the optimizer Racks and IRSAgent exceed the EIP-170 limit (24,576 bytes) and cannot
# be deployed at all. Foundry does not enforce the limit in tests, so this was invisible until now.
optimizer = true
optimizer_runs = 200
gas_limit = "18446744073709551615"
src = "src"
out = "out"
libs = ["lib"]

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options

[invariant]
runs = 256
depth = 30
fail_on_revert = false
